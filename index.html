<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Meu Estudo</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6366f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Meu Estudo">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header>
      <div class="header-left">
        <span class="logo">📚</span>
        <h1>Meu Estudo</h1>
      </div>
    </header>

    <nav class="main-nav">
      <button class="nav-btn active" data-tab="dashboard">
        <span class="nav-icon">📊</span>
        <span>Dashboard</span>
      </button>
      <button class="nav-btn" data-tab="pomodoro">
        <span class="nav-icon">⏱️</span>
        <span>Pomodoro</span>
      </button>
      <button class="nav-btn" data-tab="registrar">
        <span class="nav-icon">➕</span>
        <span>Registrar</span>
      </button>
      <button class="nav-btn" data-tab="metas">
        <span class="nav-icon">🎯</span>
        <span>Metas</span>
      </button>
      <button class="nav-btn" data-tab="materias">
        <span class="nav-icon">📖</span>
        <span>Matérias</span>
      </button>
    </nav>

    <main>
      <!-- Dashboard -->
      <section id="dashboard" class="tab active">
        <div class="period-selector">
          <button class="period-btn active" data-period="hoje">Hoje</button>
          <button class="period-btn" data-period="semana">Semana</button>
          <button class="period-btn" data-period="mes">Mês</button>
        </div>

        <div id="progress-cards"></div>

        <div class="card">
          <h3>Tempo por Matéria</h3>
          <canvas id="subjectChart"></canvas>
        </div>

        <div class="card">
          <h3>Últimas sessões</h3>
          <div id="recent-sessions"></div>
        </div>
      </section>

      <!-- Pomodoro -->
      <section id="pomodoro" class="tab">
        <div class="pomodoro-screen">
          <div class="mode-label" id="mode-label">Foco</div>
          <div class="timer-display" id="timer-display">25:00</div>
          <div class="current-subject" id="current-subject">Selecione uma matéria</div>

          <button id="btn-start" class="btn-primary big">Iniciar</button>

          <div class="control-row">
            <button id="btn-pause" class="btn-secondary" disabled>Pausar</button>
            <button id="btn-stop" class="btn-secondary">Parar</button>
            <button id="btn-reset" class="btn-secondary">Reset</button>
          </div>

          <div class="card settings-card">
            <label>Matéria</label>
            <select id="pomodoro-subject"></select>

            <div class="two-cols">
              <div>
                <label>Foco (min)</label>
                <input type="number" id="focus-time" value="25" min="1" max="120">
              </div>
              <div>
                <label>Pausa (min)</label>
                <input type="number" id="break-time" value="5" min="1" max="30">
              </div>
            </div>
          </div>

          <p class="pomodoro-count">Pomodoros hoje: <strong id="pomodoros-hoje">0</strong></p>
        </div>
      </section>

      <!-- Registrar -->
      <section id="registrar" class="tab">
        <form id="session-form" class="card form">
          <h3>Registrar sessão</h3>
          <label>Matéria</label>
          <select id="session-subject" required></select>

          <label>Quanto tempo estudou?</label>
          <div class="time-inputs">
            <div>
              <input type="number" id="session-hours" min="0" max="12" placeholder="0">
              <span>horas</span>
            </div>
            <div>
              <input type="number" id="session-minutes" min="0" max="59" placeholder="0">
              <span>minutos</span>
            </div>
          </div>

          <label>O que você estudou?</label>
          <textarea id="session-notes" placeholder="Resumo rápido..."></textarea>

          <label>Como foi?</label>
          <select id="session-feeling">
            <option value="bom">😊 Bom</option>
            <option value="medio">😐 Médio</option>
            <option value="ruim">😞 Ruim</option>
          </select>

          <button type="submit" class="btn-primary">Salvar sessão</button>
        </form>
      </section>

      <!-- Metas -->
      <section id="metas" class="tab">
        <form id="goals-form" class="card form">
          <h3>Meta Diária</h3>
          <p class="hint">Digite no formato horas:minutos<br>Exemplo: 02:30 ou 00:45</p>

          <label>Quanto você quer estudar por dia?</label>
          <input type="text" id="goal-daily" placeholder="00:00" maxlength="5">
          <p class="example" id="ex-daily"></p>

          <div class="projections">
            <p><strong>Projeção Semanal:</strong> <span id="proj-weekly">—</span></p>
            <p><strong>Projeção Mensal:</strong> <span id="proj-monthly">—</span></p>
          </div>

          <button type="submit" class="btn-primary">Salvar meta</button>
        </form>
      </section>

      <!-- Matérias -->
      <section id="materias" class="tab">
        <form id="subject-form" class="card form">
          <h3>Nova matéria</h3>
          <input type="text" id="subject-name" required placeholder="Nome da matéria">
          <label>Cor</label>
          <input type="color" id="subject-color" value="#6366f1">
          <button type="submit" class="btn-primary">Adicionar</button>
        </form>

        <div id="subjects-list"></div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="app.js"></script>
</body>
</html>
